<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production groups</title><script src="/static/reach_auth.js"></script><link rel="stylesheet" href="/static/fonts/foresight-fonts.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100d09;color:#f1e3c6;font:16px/1.5 var(--fs-font-body,system-ui)}main{max-width:950px;margin:auto;padding:24px 18px}h1,h2{color:#d6a957;font-family:var(--fs-font-display,Georgia)}a{color:#d6a957}input,select,button{font:inherit;min-height:44px;background:#211a12;color:inherit;border:1px solid #806746;border-radius:6px;padding:8px}button{cursor:pointer}input:not([type=checkbox]),select{width:100%}label{display:block;margin:12px 0}section{border:1px solid #655035;padding:18px;margin:20px 0;border-radius:10px}.member{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 120px;gap:10px;align-items:center;margin:14px 0}.member span{overflow-wrap:anywhere}#status{min-height:26px;color:#e9ba84}[hidden]{display:none!important}@media(max-width:600px){.member{grid-template-columns:30px minmax(0,1fr)}.member input[type=text],.member select{grid-column:2}}</style></head><body><main><h1>Production groups</h1><p>Create a production and choose its people, departments and producers. Group notes go only to the people selected for that production.</p><a href="/foresight">Foresight</a> · <a href="/walk">Studio and sticky notes</a><p id="status" role="status" aria-live="polite"></p><label>Production<select id="groups"><option value="">New production</option></select></label><section><form id="editor"><label>Production name<input id="name" maxlength="80" required></label><div id="members"></div><button id="save">Save production</button></form></section></main><script src="/static/production_groups.js"></script></body></html>
