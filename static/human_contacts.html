<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts and messages</title><script src="/static/reach_auth.js"></script><style>:root{color-scheme:dark}body{margin:20px;background:#100d09;color:#f1e3c6;font:16px/1.5 system-ui}h1,h2,a{color:#d6a957}input,textarea,button{font:inherit;background:#241c13;color:inherit;border:1px solid #806746;padding:10px;margin:5px;border-radius:6px;min-height:44px}input,textarea{box-sizing:border-box;width:min(100%,650px)}article{border-bottom:1px solid #655035;padding:12px 0}#log{max-height:40vh;overflow:auto;white-space:pre-wrap}#status{color:#e9ba84;min-height:26px}[hidden]{display:none!important}</style></head><body><h1>Contacts and private messages</h1><a href="/static/human_profile.html">Profiles and people</a><p id="status" role="status" aria-live="polite"></p><form id="request"><label>PubCast ID or handle<br><input id="person" maxlength="100" required></label><br><label>Message request<br><input id="hello" maxlength="280"></label><br><button>Request contact</button></form><button id="refresh">Refresh contacts</button><h2>Requests for you</h2><div id="pending"></div><h2>Open conversations</h2><div id="active"></div><h2>Blocked contacts</h2><div id="blocked"></div><section id="conversation" hidden><h2 id="who"></h2><div id="log" role="log" aria-live="polite"></div><form id="send"><textarea id="text" maxlength="10000" aria-label="Private message" required></textarea><button>Send private message</button></form></section><script src="/static/human_contacts.js"></script></body></html>
