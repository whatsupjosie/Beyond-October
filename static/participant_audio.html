<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PubCast — Contribute microphone audio</title>
<style>body{font:18px system-ui;max-width:42rem;margin:3rem auto;padding:1rem;background:#101827;color:#eee}button,a{font:inherit}button{padding:.8rem;margin:.5rem 0}label{display:block;line-height:1.6}a{color:#a9d5ff}#status{overflow-wrap:anywhere}</style></head><body>
<h1>Connect your microphone</h1><p>Your microphone goes to the production desk. The director can mix it into the program and record your voice separately. Use headphones. This connection does not send audio back to you.</p>
<p><a href="/login" id="login">Sign in to PubCast</a> before connecting.</p>
<label><input type="checkbox" id="consent"> I agree to send my microphone to this production and have it recorded.</label>
<button id="connect">CONNECT MICROPHONE</button> <button id="leave" disabled>DISCONNECT</button>
<p id="status" role="status" aria-live="polite">Your microphone is off.</p>
<script src="./reach_auth.js"></script><script src="./participant_audio.js"></script><script src="./participant_audio_page.js"></script></body></html>
