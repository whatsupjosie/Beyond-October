name: PubPartner Calibration
on:
  push:
    branches: [gpt/pubpartner-calibration-2026-11-22]
  pull_request:
    paths:
      - 'modules/pubpartner_calibration.py'
      - 'modules/pubpartner_routes.py'
      - 'static/pubpartner*'
      - 'tests/test_pubpartner_calibration*'
      - '.github/workflows/pubpartner-calibration.yml'
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio pyyaml
      - name: Compile calibration and shared routes
        run: python -m py_compile modules/pubpartner_calibration.py modules/pubpartner_routes.py
      - name: Execute calibration tests
        run: python -m pytest -q tests/test_pubpartner_calibration.py tests/test_pubpartner_calibration_integration_static.py
